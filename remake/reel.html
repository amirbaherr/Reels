<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
const C=document.getElementById('c'),X=C.getContext('2d');
const W=1080,H=1920,F='Peyda';
const P={paper:'#F4ECDD',ink:'#1E1B2E',mute:'#7B7389',m:'#FF6A45',a:'#5571FF',n:'#FFC23A',mint:'#21B48A',white:'#FFFBF3',pink:'#FF9EC4',deep:'#E89B1C'};
const LET={m:'م',a:'ا',n:'ن'};
const COL={m:P.m,a:P.a,n:P.n};
const TXTC={m:P.ink,a:P.white,n:P.ink};

/* ---------- math ---------- */
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const pr=(t,a,b)=>cl((t-a)/(b-a));
const eo=t=>1-Math.pow(1-t,3);
const eio=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const eb=t=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const pop=(t,a,d=.38)=>t<a?0:eb(pr(t,a,a+d));
const vis=(t,a,b,fi=.3,fo=.3)=>Math.min(pr(t,a,a+fi),1-pr(t,b-fo,b));
const fa=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
let BASE=.26;
const RTL=/[ء-يپچژکگی]/;
function rng(seed){let s=seed%2147483647||1;return()=>(s=s*16807%2147483647)/2147483647;}

/* ---------- drawing ---------- */
function rr(x,y,w,h,r){X.beginPath();X.roundRect(x,y,w,h,Math.min(r,Math.abs(w)/2,Math.abs(h)/2));}
function card(x,y,w,h,o={}){
  const r=o.r??26,sh=o.sh??12,lw=o.lw??6;
  if(w<=0||h<=0)return;
  if(sh){X.fillStyle=o.shc||P.ink;rr(x+sh,y+sh,w,h,r);X.fill();}
  X.fillStyle=o.fill||P.white;rr(x,y,w,h,r);X.fill();
  if(lw){X.lineWidth=lw;X.strokeStyle=o.stroke||P.ink;X.stroke();}
}
function txt(s,x,y,size,color=P.ink,align='center',dir){
  X.font=`${size}px ${F}`;X.fillStyle=color;X.textAlign=align;X.textBaseline='alphabetic';
  X.direction=dir||(RTL.test(s)?'rtl':'ltr');
  X.fillText(s,x,y+size*BASE);
}
function tw(s,size){X.font=`${size}px ${F}`;X.direction=RTL.test(s)?'rtl':'ltr';return X.measureText(s).width;}
function withT(x,y,o,fn){
  const a=o.a??1;if(a<=0.001)return;
  const s=o.s??1;if(Math.abs(s)<0.001)return;
  X.save();X.translate(x,y);if(o.r)X.rotate(o.r);
  X.scale((o.sx??1)*s,(o.sy??1)*s);X.globalAlpha*=a;fn();X.restore();
}
function chip(s,x,y,size,o={}){
  const w=tw(s,size)+size*.9,h=size*1.45;
  card(x-w/2,y-h/2,w,h,{fill:o.fill||P.white,r:o.r??h/2,sh:o.sh??7,lw:o.lw??5});
  txt(s,x,y,size,o.color||P.ink,'center',o.dir);
  return w;
}
function tile(k,x,y,o={}){
  const z=o.size||128;
  withT(x,y,{s:o.s??1,a:o.a??1,r:o.r||0,sx:o.sx},()=>{
    const fill=o.fill||(o.plain?P.white:COL[k]);
    card(-z/2,-z/2,z,z,{fill,r:z*.2,sh:z*.08,lw:z*.05});
    txt(o.ch||LET[k],0,-z*.02,z*.56,o.tc||(o.plain?P.ink:TXTC[k]));
  });
}
function dashedBox(x,y,w,h,r,a=1){
  X.save();X.globalAlpha*=a;X.setLineDash([18,14]);X.lineWidth=5;X.strokeStyle=P.ink;rr(x,y,w,h,r);X.stroke();X.restore();
}
function check(x,y,r,s=1){
  withT(x,y,{s},()=>{
    X.fillStyle=P.ink;X.beginPath();X.arc(6,6,r,0,7);X.fill();
    X.fillStyle=P.mint;X.beginPath();X.arc(0,0,r,0,7);X.fill();X.lineWidth=5;X.strokeStyle=P.ink;X.stroke();
    X.lineWidth=r*.24;X.strokeStyle=P.white;X.lineCap='round';X.lineJoin='round';
    X.beginPath();X.moveTo(-r*.42,0);X.lineTo(-r*.1,r*.32);X.lineTo(r*.45,-r*.32);X.stroke();
  });
}
function crossMark(x,y,r,s=1){
  withT(x,y,{s},()=>{
    X.fillStyle=P.ink;X.beginPath();X.arc(5,5,r,0,7);X.fill();
    X.fillStyle=P.m;X.beginPath();X.arc(0,0,r,0,7);X.fill();X.lineWidth=5;X.strokeStyle=P.ink;X.stroke();
    X.lineWidth=r*.22;X.strokeStyle=P.white;X.lineCap='round';
    X.beginPath();X.moveTo(-r*.35,-r*.35);X.lineTo(r*.35,r*.35);X.moveTo(r*.35,-r*.35);X.lineTo(-r*.35,r*.35);X.stroke();
  });
}
function heart(x,y,s,col,a){
  withT(x,y,{s,a},()=>{
    X.beginPath();X.moveTo(0,12);
    X.bezierCurveTo(-30,-10,-18,-36,0,-20);X.bezierCurveTo(18,-36,30,-10,0,12);
    X.fillStyle=col;X.fill();X.lineWidth=4;X.strokeStyle=P.ink;X.stroke();
  });
}
function spark(x,y,s,col,rot=0){
  withT(x,y,{s,r:rot},()=>{
    X.beginPath();
    for(let i=0;i<8;i++){const r=i%2?9:30,an=i*Math.PI/4;X.lineTo(Math.cos(an)*r,Math.sin(an)*r);}
    X.closePath();X.fillStyle=col;X.fill();X.lineWidth=4;X.strokeStyle=P.ink;X.stroke();
  });
}
function qmark(x,y,size,t,ph=0,col=P.m){
  withT(x,y,{r:Math.sin(t*5+ph)*.18},()=>{
    X.font=`${size}px ${F}`;X.textAlign='center';X.direction='rtl';
    X.lineWidth=size*.09;X.strokeStyle=P.ink;X.lineJoin='round';
    X.strokeText('؟',0,size*.36);X.fillStyle=col;X.fillText('؟',0,size*.36);
  });
}
function pressBar(cx,y,w,label='zip'){
  card(cx-w/2,y-40,w,80,{fill:P.ink,r:40,sh:0});
  X.fillStyle=P.n;
  for(let i=0;i<14;i++){const x=cx-w/2+60+i*((w-120)/13);rr(x-7,y-22,14,44,4);X.fill();}
  card(cx-70,y-34,140,68,{fill:P.n,r:34,sh:0,lw:5});
  txt(label,cx,y-2,46,P.ink,'center','ltr');
}

/* ---------- background ---------- */
let BG;
function makeBG(){
  BG=document.createElement('canvas');BG.width=W;BG.height=H;const g=BG.getContext('2d');
  g.fillStyle=P.paper;g.fillRect(0,0,W,H);
  // soft shapes
  g.globalAlpha=.18;g.fillStyle=P.n;g.beginPath();g.arc(W+40,-60,330,0,7);g.fill();
  g.globalAlpha=.12;g.fillStyle=P.a;g.beginPath();g.arc(-120,H+40,360,0,7);g.fill();
  g.globalAlpha=.10;g.fillStyle=P.m;g.beginPath();g.arc(-80,560,140,0,7);g.fill();
  g.globalAlpha=1;
  // dot grid
  g.fillStyle='rgba(30,27,46,.11)';
  for(let y=48;y<H;y+=56)for(let x=36;x<W;x+=56){g.beginPath();g.arc(x,y,2.4,0,7);g.fill();}
  // grain
  const id=g.getImageData(0,0,W,H),d=id.data,r=rng(99);
  for(let i=0;i<d.length;i+=4){const v=(r()-.5)*16;d[i]+=v;d[i+1]+=v;d[i+2]+=v;}
  g.putImageData(id,0,0);
}

/* ---------- captions ---------- */
const RAW=`0.00|یه پوشه‌ی یک گیگی رو

86.30|END`;
const CAPS=[];
(function(){
  const L=RAW.trim().split('\n').map(l=>{const [s,tx]=l.split('|');return {s:+s,tx};});
  for(let i=0;i<L.length-1;i++){
    const s=L[i].s,e=L[i+1].s;let inH=false;const words=[];
    for(let tok of L[i].tx.split(' ')){
      if(tok.startsWith('*')){inH=true;tok=tok.slice(1);}
      const h=inH;if(tok.includes('*')){tok=tok.replace('*','');inH=false;}
      words.push({tx:tok.replace(/ /g,' '),hl:h,ltr:!RTL.test(tok)});
    }
    for(let j=words.length-1;j>0;j--){if(words[j].hl&&words[j-1].hl){words[j-1].tx+=' '+words[j].tx;words[j-1].ltr=words[j-1].ltr&&words[j].ltr;words.splice(j,1);}}
    const wts=words.map(w=>w.tx.length+3),tot=wts.reduce((a,b)=>a+b,0);
    const span=Math.min((e-s)*.72,words.length*.42);let acc=0;
    words.forEach((w,j)=>{w.t=s+span*acc/tot;acc+=wts[j];});
    CAPS.push({s,e,words});
  }
})();
function captions(t){
  const ph=CAPS.find(p=>t>=p.s&&t<p.e);if(!ph)return;
  const size=80,y=1505,sp=size*.3,pad=size*.32;
  const ws=ph.words.map(w=>tw(w.tx,size)+(w.hl?pad*2:0));
  const tot=ws.reduce((a,b)=>a+b,0)+sp*(ws.length-1);
  const k=Math.min(1,960/tot);
  let x=540+tot*k/2;
  let act=-1;ph.words.forEach((w,j)=>{if(t>=w.t)act=j;});
  const out=1-pr(t,ph.e-.09,ph.e);
  X.save();X.globalAlpha=out;
  ph.words.forEach((w,j)=>{
    const ww=ws[j]*k,cx=x-ww/2;x-=ww+sp*k;
    const a=pr(t,w.t,w.t+.16);if(a<=0)return;
    const s=(.55+.45*eb(a))*k;
    withT(cx,y+(1-eo(a))*22,{s,a:Math.min(1,a*2)},()=>{
      if(w.hl){
        withT(0,0,{r:-.03},()=>card(-ws[j]/2,-size*.66,ws[j],size*1.32,{fill:P.n,r:20,sh:7,lw:5}));
      }
      const col=(w.hl||j===act)?P.ink:P.mute;
      txt(w.tx,0,0,size,col,'center',w.ltr?'ltr':'rtl');
    });
  });
  X.restore();
}

/* ---------- header ---------- */
const CH=[[0,'۱','۶۰۰ مگ کجا رفت؟'],[10,'۲','شمردن حرف‌ها'],[30.25,'۳','کد هافمن'],[50.17,'۴','خوندن بیت‌ها'],[68,'۵','zip واقعی'],[86,'','']];
function header(t){
  if(t>=86.2)return;
  const al=1-pr(t,85.9,86.2);
  let i=0;for(let k=0;k<CH.length-1;k++)if(t>=CH[k][0])i=k;
  const [s,num,title]=CH[i];
  const p=pr(t,s,s+.45);
  X.save();X.globalAlpha=al*(i===0?pr(t,0,.3):1);
  // pill
  const size=40,w=tw(title,size)+130;
  withT(0,(1-eo(p))*-24,{a:Math.max(.0001,eo(p))},()=>{
    card(1010-w,112,w,84,{fill:P.white,r:42,sh:7,lw:5});
    X.fillStyle=P.ink;X.beginPath();X.arc(1010-42,154,30,0,7);X.fill();
    txt(num,1010-42,150,36,P.n);
    txt(title,1010-84,150,size,P.ink,'right','rtl');
  });
  // progress
  for(let k=0;k<5;k++){
    const x=70+k*58;
    X.fillStyle='rgba(30,27,46,.15)';rr(x,146,48,14,7);X.fill();
    const e=k<CH.length-1?CH[k+1][0]:86;
    const f=k<i?1:k>i?0:pr(t,CH[k][0],e);
    if(f>0){X.fillStyle=P.ink;rr(x,146,Math.max(14,48*f),14,7);X.fill();}
  }
  X.restore();
}

/* ---------- folder ---------- */
function folder(cx,by,w,h,c,label,o={}){
  const hh=h*c,top=by-hh;
  card(cx-w/2+8,top-58,w*.4,100,{fill:P.deep,r:24,sh:12});
  card(cx-w/2,top,w,hh,{fill:'#F3B135',r:30,sh:12});
  if(o.inside)o.inside(top);
  const fh=hh*.86;
  card(cx-w/2,by-fh,w,fh,{fill:P.n,r:30,sh:0});
  // stripe
  X.fillStyle='rgba(30,27,46,.10)';rr(cx-w/2+30,by-fh+22,w-60,10,5);X.fill();
  const ls=Math.min(1,fh/150);
  withT(cx,by-fh/2+6,{s:ls*(o.ls??1)},()=>chip(label,0,0,62,{fill:P.white,sh:6}));
}
function sizeLabel(v){return v>=999.5?'۱ گیگ':fa(Math.round(v/10)*10)+' مگ';}
function ghost(cx,by,w,h,a){dashedBox(cx-w/2,by-h,w,h,30,a);}

function sFolder(t){
  const al=vis(t,0,6.95,.2,.3);if(al<=0)return;
  X.save();X.globalAlpha=al;
  const cx=540,by=1080,w=620,h=440;
  let c;
  if(t<2.83)c=lerp(1,.42,eb(pr(t,1.0,1.32)));
  else if(t<5)c=lerp(.42,1,eb(pr(t,2.83,3.25)));
  else c=lerp(1,.42,eb(pr(t,5.0,5.35)));
  let v;
  if(t<1.62)v=1000;else if(t<2.83)v=lerp(1000,400,eo(pr(t,1.62,2.3)));
  else if(t<5)v=lerp(400,1000,eo(pr(t,2.83,3.2)));else v=lerp(1000,400,eo(pr(t,5.0,5.4)));
  // ghost (where 600 went)
  const ga=pr(t,5.05,5.4);
  if(ga>0){
    ghost(cx,by,w,h,ga);
    const gy=by-h+(h*(1-.42))/2-20;
    withT(cx,gy,{s:pop(t,5.15),r:Math.sin(t*3)*.03},()=>chip('۶۰۰ مگ',0,0,60,{fill:P.white}));
    [[5.7,180,520,90,0],[5.86,900,600,120,1],[6.02,140,780,70,2]].forEach(([tt,x,y,sz,ph])=>{
      const p=pop(t,tt,.35);if(p>0)withT(x,y,{s:p},()=>qmark(0,0,sz,t,ph,[P.m,P.a,P.n][ph]));
    });
  }
  const p0=pop(t,.05,.5);
  withT(cx,by,{s:p0},()=>{
    X.translate(-cx,-by);
    folder(cx,by,w,h,c,sizeLabel(v),{inside:(top)=>{
      const pa=pop(t,3.72,.45),pb=eio(pr(t,4.7,5.0));const k=pa*(1-pb);
      if(k>0)for(let i=0;i<3;i++){
        const x=cx+(i-1)*170*k,y=top+80-k*190-(i===1?40*k:0);
        withT(x,y,{r:(i-1)*.22*k},()=>{
          card(-66,-86,132,172,{fill:P.white,r:16,sh:8,lw:5});
          X.fillStyle=[P.m,P.a,P.mint][i];rr(-40,-56,80,14,7);X.fill();
          X.fillStyle='rgba(30,27,46,.25)';for(let l=0;l<4;l++){rr(-40,-26+l*24,80-(l%2)*24,9,4);X.fill();}
        });
      }
    }});
  });
  // press bar
  if(t>.8&&t<3.0){
    const rest=by-h*c-58-44;
    let y;if(t<1.0)y=lerp(-120,rest,eio(pr(t,.8,1.0)));else if(t<2.6)y=rest;else y=lerp(rest,-120,eio(pr(t,2.6,2.95)));
    pressBar(cx,y,720);
  }
  const ck=pop(t,3.95,.4);if(ck>0&&t<5)check(cx+250,by-h-40,56,ck*(1-pr(t,4.75,4.95)));
  X.restore();
}

/* ---------- scene 3: nothing deleted ---------- */
const SEQ12='mamanmmamanm';
function sNothing(t){
  const al=vis(t,6.8,10.2,.3,.3);if(al<=0)return;
  X.save();X.globalAlpha=al;
  // trash + prohibition
  withT(540,520,{s:pop(t,6.85,.45)},()=>{
    card(-74,-50,148,176,{fill:P.white,r:20,sh:10});
    X.fillStyle='rgba(30,27,46,.3)';for(let i=-1;i<=1;i++){rr(i*36-5,-20,10,120,5);X.fill();}
    card(-96,-88,192,34,{fill:P.white,r:14,sh:8});
    card(-30,-112,60,28,{fill:P.white,r:10,sh:0});
    X.lineWidth=22;X.strokeStyle=P.ink;X.beginPath();X.arc(6,24,150,0,7);X.stroke();
    X.lineWidth=18;X.strokeStyle=P.m;X.beginPath();X.arc(0,18,150,0,7);X.stroke();
    X.beginPath();X.moveTo(-106,-88);X.lineTo(106,124);X.stroke();
  });
  // strips
  const yA=870,yB=1140;
  const la=pop(t,7.7,.3);
  if(la>0)withT(960,yA-92,{s:la},()=>chip('قبل',0,0,38,{fill:P.white}));
  for(let i=0;i<12;i++){
    const p=pop(t,7.72+i*.035,.3);if(p<=0)continue;
    tile(SEQ12[i],540+(5.5-i)*76,yA,{size:66,s:p});
  }
  const k=eio(pr(t,8.85,9.5));
  const lb=pop(t,8.75,.3);

function plen(pts){let L=0;for(let i=1;i<pts.length;i++)L+=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);return L;}

    if(acc+d>=L){const u=d?(L-acc)/d:0;out.push([lerp(pts[i-1][0],pts[i][0],u),lerp(pts[i-1][1],pts[i][1],u)]);return out;}
    acc+=d;out.push(pts[i]);

}

      X.fillStyle=P.m;X.beginPath();X.moveTo(x-18,-86);X.lineTo(x+18,-86);X.lineTo(x,-64);X.closePath();X.fill();X.lineWidth=4;X.strokeStyle=P.ink;X.stroke();

    X.restore();
